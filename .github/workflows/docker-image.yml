name: Build & Publish Container

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The publish builds the web UI (npm ci and npm run build in src/BF2WebAdmin.Web) into wwwroot. setup-node reads
      # the Node version from the volta pin in its package.json
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/BF2WebAdmin.Web/package.json
          cache: npm
          cache-dependency-path: src/BF2WebAdmin.Web/package-lock.json

      # The unit tests
      - name: Run tests
        run: dotnet test test/BF2WebAdmin.Tests/BF2WebAdmin.Tests.csproj

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push container to Docker Hub
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          export ContainerImageTags="${VERSION};latest"
          dotnet publish "src/BF2WebAdmin.Server/BF2WebAdmin.Server.csproj" \
            -c Release \
            -p Version=$VERSION \
            -p RuntimeIdentifier=linux-x64 \
            -p ContainerRegistry=docker.io \
            -p ContainerRepository=nihlen/bf2-webadmin \
            /t:PublishContainer
